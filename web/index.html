<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COOP</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="wordmark">COOP</h1>
    <div class="topbar-status">
      <span class="pill" id="live-pill"><span class="dot"></span><span class="label">CONNECTING</span></span>
      <div class="mode-switch" role="group" aria-label="Mode">
        <button type="button" data-mode="auto" class="active" title="Auto (1)" aria-pressed="true">Auto</button>
        <button type="button" data-mode="manual" title="Manual (2)" aria-pressed="false">Manual</button>
        <button type="button" data-mode="stop" title="Stop (3)" aria-pressed="false">Stop</button>
      </div>
    </div>
  </header>

  <div class="conn-banner danger" id="conn-banner" role="status" hidden>
    <span class="dot"></span>
    <div class="conn-text">
      <strong id="conn-title"></strong>
      <span id="conn-detail"></span>
    </div>
    <button type="button" class="conn-action" id="conn-action" hidden>Reload</button>
  </div>

  <main class="layout">
    <section class="card hero">
      <div class="hero-frame" id="hero-frame">
        <img class="feed" id="feed-img" alt="Live camera feed" hidden>
        <canvas class="feed-mock" id="feed-mock-canvas" hidden></canvas>
        <div class="no-signal" id="no-signal" hidden>No signal</div>
        <svg class="overlay" id="overlay-svg" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid meet"></svg>
        <span class="pill state-mock mock-badge" id="mock-badge" hidden><span class="dot"></span><span class="label">MOCK FEED</span></span>
        <button type="button" class="fs-btn" id="fs-btn" aria-label="Fullscreen (F)" title="Fullscreen (F)">
          <svg id="fs-icon-enter" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg id="fs-icon-exit" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="display:none"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
      </div>

      <div class="legend" id="legend" hidden>
        <span class="legend-item"><svg viewBox="0 0 24 12" width="24" height="12" aria-hidden="true"><line class="lg-velocity" x1="1" y1="6" x2="17" y2="6"/><path class="lg-arrowhead" d="M15 1 L23 6 L15 11 z"/></svg>Velocity</span>
        <span class="legend-item"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle class="lg-aim" cx="8" cy="8" r="5"/></svg>Predicted aim</span>
        <span class="legend-item"><svg viewBox="0 0 24 8" width="24" height="8" aria-hidden="true"><circle class="lg-trail" cx="3" cy="4" r="1.5" fill-opacity="0.25"/><circle class="lg-trail" cx="11" cy="4" r="2.2" fill-opacity="0.5"/><circle class="lg-trail" cx="19" cy="4" r="3" fill-opacity="0.8"/></svg>Aim trail</span>
      </div>

      <div class="dpad-wrap" id="dpad-wrap" hidden>
        <div class="dpad">
          <button type="button" class="up" id="dpad-up" aria-label="Tilt up">&#9650;</button>
          <button type="button" class="left" id="dpad-left" aria-label="Pan left">&#9664;</button>
          <button type="button" class="home" id="dpad-home" aria-label="Home (H)">&#8982;</button>
          <button type="button" class="right" id="dpad-right" aria-label="Pan right">&#9654;</button>
          <button type="button" class="down" id="dpad-down" aria-label="Tilt down">&#9660;</button>
        </div>
        <p class="kbd-hint"><kbd>←</kbd><kbd>→</kbd> nudge 5° · <kbd>Shift</kbd> for 1° · <kbd>H</kbd> home</p>
      </div>
    </section>

    <aside class="rail">
      <section class="card">
        <h2 class="card-title">Target</h2>
        <div class="target-head">
          <span class="target-label" id="target-label" hidden></span>
          <span class="target-empty" id="target-empty">No target</span>
          <span class="pill" id="target-lock-pill">AUTO</span>
        </div>
        <div id="target-stats" hidden>
          <div class="stat-row">
            <span class="k">Confidence</span>
            <span class="v"><span class="dot-meter" id="conf-meter"></span> <span id="conf-num" class="tabular"></span></span>
          </div>
          <div class="stat-row">
            <span class="k">Velocity</span>
            <span class="v tabular" id="vel-num">–</span>
          </div>
          <div class="stat-row" id="lead-row" hidden>
            <span class="k" title="How far the predicted aim sits ahead of the target">Lead</span>
            <span class="v tabular lead" id="lead-num">–</span>
          </div>
        </div>
        <button type="button" class="btn" id="lock-btn" disabled>No target</button>
      </section>

      <section class="card">
        <h2 class="card-title">Gimbal</h2>
        <div class="dial-wrap">
          <svg id="dial-svg" viewBox="0 0 200 130" width="100%">
            <path id="dial-track" fill="none" stroke="var(--surface-border)" stroke-width="10" stroke-linecap="round"></path>
            <path id="dial-target-tick" fill="none" stroke="var(--warm)" stroke-width="4" stroke-linecap="round" opacity="0.85"></path>
            <line id="dial-needle" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"></line>
            <circle id="dial-pivot" cx="100" cy="110" r="3" fill="var(--text-muted)"></circle>
            <circle id="dial-needle-dot" r="5" fill="var(--accent)"></circle>
            <text id="dial-min-label" x="6" y="126" class="mono"></text>
            <text id="dial-max-label" x="194" y="126" text-anchor="end" class="mono"></text>
          </svg>
          <div class="dial-readout">
            <div class="item">
              <div class="num tabular" id="pan-current-num">0.0°</div>
              <div class="lbl">Pan</div>
            </div>
            <div class="item">
              <div class="num tabular" id="pan-target-num">0.0°</div>
              <div class="lbl">Target</div>
            </div>
            <div class="item" id="tilt-readout" hidden>
              <div class="num tabular" id="tilt-num">0.0°</div>
              <div class="lbl">Tilt</div>
            </div>
          </div>
          <div class="tilt-note" id="tilt-note">Tilt fixed</div>
        </div>
        <div class="motors-chip">
          <span class="pill" id="motors-chip"><span class="dot"></span><span class="label">Motors</span></span>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">Detections</h2>
        <div class="det-list" id="det-list">
          <div class="empty-note">Nothing in view</div>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">Event log</h2>
        <div class="event-list" id="event-list"></div>
      </section>
    </aside>
  </main>

  <p class="footer-note">COOP · Pi 5 tracking camera</p>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
